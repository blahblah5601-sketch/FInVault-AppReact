# FinVault banking app schema with sync metadata

type User @table {
  id: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(255)")
  password_hash: String! @col(dataType: "varchar(255)")
  created_at: Timestamp! @default(expr: "request.time")
  updated_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Account @table {
  id: Int! @default(expr: "autoIncrement")
  user_id: String! @col(dataType: "varchar(255)")
  account_type: String! @col(dataType: "varchar(50)")
  balance: Decimal(15,2) @default(expr: "0.00")
  account_number: String! @col(dataType: "varchar(20)")
  created_at: Timestamp! @default(expr: "request.time")
  updated_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Transaction @table {
  id: Int! @default(expr: "autoIncrement")
  account_id: Int!
  transaction_type: String! @col(dataType: "varchar(20)")
  amount: Decimal(15,2) @default(expr: "0.00")
  description: String @col(dataType: "text")
  status: String @default(expr: "pending") @col(dataType: "varchar(20)")
  created_at: Timestamp! @default(expr: "request.time")
  updated_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Vault @table {
  id: Int! @default(expr: "autoIncrement")
  user_id: String! @col(dataType: "varchar(255)")
  name: String! @col(dataType: "varchar(100)")
  goal_amount: Decimal(15,2) @default(expr: "0.00")
  current_amount: Decimal(15,2) @default(expr: "0.00")
  created_at: Timestamp! @default(expr: "request.time")
  updated_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Budget @table {
  id: Int! @default(expr: "autoIncrement")
  user_id: String! @col(dataType: "varchar(255)")
  category: String! @col(dataType: "varchar(100)")
  limit_amount: Decimal(15,2) @default(expr: "0.00")
  current_amount: Decimal(15,2) @default(expr: "0.00")
  month: Int!
  year: Int!
  created_at: Timestamp! @default(expr: "request.time")
  updated_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type BankConnection @table {
  id: String! @default(expr: "uuidV4()")
  bankName: String! @col(dataType: "varchar(100)")
  bankId: String! @col(dataType: "varchar(100)")
  connectionStatus: String @default(expr: "disconnected") @col(dataType: "varchar(20)")
  lastSynced: Timestamp @default(expr: "request.time")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type BankAccount @table {
  id: String! @default(expr: "uuidV4()")
  accountName: String! @col(dataType: "varchar(100)")
  accountNumber: String! @col(dataType: "varchar(34)")
  bankConnectionId: String! @col(dataType: "varchar(100)")
  accountType: String! @col(dataType: "varchar(20)")
  balance: Decimal(15,2) @default(expr: "0.00")
  currency: String! @col(dataType: "varchar(3)")
  isPrimary: Boolean @default(expr: "false")
  isActive: Boolean @default(expr: "true")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Card @table {
  id: String! @default(expr: "uuidV4()")
  cardNickname: String! @col(dataType: "varchar(50)")
  lastFour: String! @col(dataType: "varchar(4)")
  bankAccountId: String! @col(dataType: "varchar(100)")
  cardType: String! @col(dataType: "varchar(20)")
  network: String! @col(dataType: "varchar(20)")
  isPrimary: Boolean @default(expr: "false")
  isActive: Boolean @default(expr: "true")
  spendingLimit: Decimal(15,2) @default(expr: "0.00")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Payment @table {
  id: String! @default(expr: "uuidV4()")
  amount: Decimal(15,2) @default(expr: "0.00")
  currency: String! @col(dataType: "varchar(3)")
  description: String @col(dataType: "text")
  category: String @col(dataType: "varchar(50)")
  sourceAccountId: String! @col(dataType: "varchar(100)")
  destination: String! @col(dataType: "varchar(255)")
  destinationType: String! @col(dataType: "varchar(20)")
  status: String @default(expr: "pending") @col(dataType: "varchar(20)")
  paymentMethod: String! @col(dataType: "varchar(20)")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Beneficiary @table {
  id: String! @default(expr: "uuidV4()")
  beneficiaryName: String! @col(dataType: "varchar(100)")
  nickname: String! @col(dataType: "varchar(50)")
  destinationType: String! @col(dataType: "varchar(20)")
  destinationValue: String! @col(dataType: "varchar(255)")
  isActive: Boolean @default(expr: "true")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type Biller @table {
  id: String! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(100)")
  category: String! @col(dataType: "varchar(50)")
  accountRef: String! @col(dataType: "varchar(255)")
  lastAmount: Decimal(15,2) @default(expr: "0.00")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}

type PaymentMethod @table {
  id: String! @default(expr: "uuidV4()")
  methodType: String! @col(dataType: "varchar(20)")
  isEnabled: Boolean @default(expr: "true")
  isPrimary: Boolean @default(expr: "false")
  created_at: Timestamp! @default(expr: "request.time")

  # Sync metadata fields
  syncVersion: Int @default(expr: "0")
  lastSyncedAt: Timestamp @default(expr: "request.time")
  syncStatus: String @default(expr: "pending") @col(dataType: "varchar(20)")
  syncAttempts: Int @default(expr: "0")
  syncErrors: String @col(dataType: "text")
}